name: Build QYS Addon

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QYS Addon
        uses: actions/checkout@v4

      - name: Checkout AUTISM Client API source
        uses: actions/checkout@v4
        with:
          repository: AutismDevelopment/Autism-Client
          path: autism-client

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Publish AUTISM Client API to Maven Local
        run: gradle -p autism-client publishToMavenLocal --no-daemon

      - name: Build QYS Addon
        run: gradle build --no-daemon --stacktrace

      - name: Upload addon JAR
        uses: actions/upload-artifact@v4
        with:
          name: qys-autism-addon
          path: build/libs/*.jar
          if-no-files-found: error
