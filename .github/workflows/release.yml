name: Publish QYS Addon Release

on:
  push:
    branches:
      - qys-addon-rework

permissions:
  contents: read

jobs:
  release:
    if: github.event.head_commit.message == 'Publish QYS Addon v1.0.2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout QYS Addon
        uses: actions/checkout@v4

      - name: Checkout AUTISM Client API source
        uses: actions/checkout@v4
        with:
          repository: AutismDevelopment/Autism-Client
          path: autism-client

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Publish AUTISM Client API to Maven Local
        run: gradle -p autism-client publishToMavenLocal --no-daemon

      - name: Build QYS Addon
        run: gradle build --no-daemon --stacktrace

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: QYS AUTISM Addon v1.0.2
          body: |
            Attack-ready auto-equip update for AUTISM Client 5.0-26.2 (API v3).

            Auto Equip Mace now switches only when the configured attack window and vanilla attack cooldown are ready. Stun Slam holds the axe during setup and equips the mace only for the actual falling smash.

            The previous metadata incorrectly required the development-suffixed client version. This release declares the stable 5.0-26.2 host version. It is not a Client 5.1 / API v4 build.

            Includes the Mace, Combat, and Hitflick modules. CI compilation passed; in-game behavior should still be tested on a separate instance before regular use.
          draft: false
          prerelease: true
          files: build/libs/qys-autism-addon-1.0.2.jar
          fail_on_unmatched_files: true
