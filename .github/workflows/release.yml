name: Publish QYS Addon Release

on:
  push:
    branches:
      - qys-addon-rework

permissions:
  contents: read

jobs:
  release:
    if: github.event.head_commit.message == 'Publish QYS Addon v1.0.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout QYS Addon
        uses: actions/checkout@v4

      - name: Checkout AUTISM Client API source
        uses: actions/checkout@v4
        with:
          repository: AutismDevelopment/Autism-Client
          path: autism-client

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Publish AUTISM Client API to Maven Local
        run: gradle -p autism-client publishToMavenLocal --no-daemon

      - name: Build QYS Addon
        run: gradle build --no-daemon --stacktrace

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: QYS AUTISM Addon v1.0.0
          body: |
            First packaged release of the QYS AUTISM Addon for Minecraft 26.2.

            Includes the Mace, Combat, and Hitflick modules. This build has passed CI compilation; in-game behavior should still be tested on a separate instance before regular use.
          draft: false
          prerelease: true
          files: build/libs/qys-autism-addon-1.0.0.jar
          fail_on_unmatched_files: true
