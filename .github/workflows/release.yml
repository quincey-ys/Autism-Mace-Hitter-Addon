name: Publish QYS Addon Release

on:
  push:
    branches:
      - qys-addon-rework

permissions:
  contents: read

jobs:
  release:
    if: github.event.head_commit.message == 'Publish QYS Addon v1.0.5'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout QYS Addon
        uses: actions/checkout@v4

      - name: Checkout AUTISM Client API source
        uses: actions/checkout@v4
        with:
          repository: AutismDevelopment/Autism-Client
          path: autism-client

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Publish AUTISM Client API to Maven Local
        run: gradle -p autism-client publishToMavenLocal --no-daemon

      - name: Build QYS Addon
        run: gradle build --no-daemon --stacktrace

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: QYS AUTISM Addon v1.0.5
          body: |
            YouTube / YouTube Music browser handoff and Windows media controls for AUTISM Client 5.0-26.2 (API v3).

            Music Player now recognizes YouTube and YouTube Music video / playlist URLs and opens them in the default browser instead of trying to decode the webpage as an audio file. Play/Pause, Next, Previous, Stop, and system-volume controls are sent through Windows global media keys. Browser playback remains in the browser; a manual click on Play may be required by browser autoplay policy. Protected YouTube audio is not extracted into Minecraft.

            Keeps local MP3 / OGG / WAV / AIFF playback, M3U playlists, the Mace, Combat, and Hitflick modules. CI compilation passed; test in-game behavior on a separate instance before regular use.

            Built for Minecraft 26.2, Fabric, Java 25, and AUTISM Client 5.0 API v3. Not for Client 5.1 / API v4.
          draft: false
          prerelease: true
          files: build/libs/qys-autism-addon-1.0.5.jar
          fail_on_unmatched_files: true
